<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div *ngIf="countyName != ''; else BMLT_List">
      <ion-buttons slot="end">
        <ion-button size="small" (click)="showCountyStructure()">
          <ion-icon size="large" color="secondary" slot="start" name="caret-back-outline"></ion-icon>
          <ion-title>Back to list</ion-title>
        </ion-button>
      </ion-buttons>
    </div>
    <ng-template #BMLT_List>
      <ion-title>
        {{'MEETINGLIST' | translate}}
      </ion-title>
    </ng-template>
  </ion-toolbar>
</ion-header>

<ion-content no-padding>


  <div *ngIf="HTMLGrouping == 'counties'">
    <div *ngFor="let county of county_list">
      <ion-item-divider sticky="true" (click)="getMeetingsByCounty(county)" color="primary">
        <h3>{{ county }}</h3>
        <ion-icon size="large" color="secondary" slot="end" name="play"></ion-icon>
      </ion-item-divider>
    </div>
  </div>

  <div *ngIf="HTMLGrouping == 'meetings'">
    <div *ngIf = "isLoaded">
      <app-meeting-list [data]="meetingListCounty" meetingType='regular' expandAll='false'></app-meeting-list>
    </div>
  </div>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <div *ngIf="countyName != ''">
      <ion-title>{{ countyName }}</ion-title>
    </div>
  </ion-toolbar>
</ion-footer>
